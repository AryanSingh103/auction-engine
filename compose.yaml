# Local development stack. Values come from .env (copy .env.example); the
# ${VAR:?message} form makes compose refuse to start if a variable is missing,
# matching the app's fail-fast config.
name: auction-engine

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to loopback only: the default (0.0.0.0) would expose a database
      # with a known dev password to the whole local network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT in .env}:5432"
    volumes:
      # Postgres 18+ images declare their VOLUME at /var/lib/postgresql (not
      # .../data as in older versions); data lives in a versioned subdirectory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready uses the unix
      # socket, which the image's temporary initdb server also listens on
      # (it runs with listen_addresses=''), so the check would report healthy
      # mid-initialization, just before that server restarts.
      # $$ escapes compose interpolation, so the variables are expanded by the
      # shell inside the container.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8.8.3-alpine3.23
    # Nothing in Redis must survive a restart (cache, rate-limit buckets,
    # pub/sub): no persistence, and a memory cap with LRU eviction so the
    # cache can never grow without bound.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:?set REDIS_HOST_PORT in .env}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot schema migration. Runs to completion before the API starts;
  # the API never migrates on its own (docs/decisions/006).
  migrate:
    build: .
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL in .env}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    build: .
    # An explicit list instead of env_file: .env, so the API receives only
    # its own settings (not POSTGRES_PASSWORD, which it does not need yet).
    environment:
      # Fixed inside the container: it must match the container side of the
      # port mapping below. HTTP_ADDR in .env only applies to `make run`.
      HTTP_ADDR: ":8080"
      # Prometheus scrapes this inside the compose network; not published.
      METRICS_ADDR: ":9091"
      LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL in .env}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?set SHUTDOWN_TIMEOUT in .env}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:?set HTTP_READ_HEADER_TIMEOUT in .env}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:?set HTTP_READ_TIMEOUT in .env}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:?set HTTP_WRITE_TIMEOUT in .env}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:?set HTTP_IDLE_TIMEOUT in .env}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:?set REQUEST_TIMEOUT in .env}
      # In-network address: the postgres service name, container port 5432.
      # (.env's DATABASE_URL points at the host-published port for `make run`.)
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:?set DB_MAX_CONNS in .env}
      BID_LOCKING: ${BID_LOCKING:?set BID_LOCKING in .env}
      DB_IDLE_IN_TX_TIMEOUT: ${DB_IDLE_IN_TX_TIMEOUT:?set DB_IDLE_IN_TX_TIMEOUT in .env}
      REDIS_URL: redis://redis:6379/0
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:?set REDIS_TIMEOUT in .env}
      RATE_LIMIT_BIDS_PER_SECOND: ${RATE_LIMIT_BIDS_PER_SECOND:?set RATE_LIMIT_BIDS_PER_SECOND in .env}
      RATE_LIMIT_BID_BURST: ${RATE_LIMIT_BID_BURST:?set RATE_LIMIT_BID_BURST in .env}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:?set APP_HOST_PORT in .env}:8080"
    # Hardening that costs nothing with a static binary: no writes to the
    # image filesystem, no Linux capabilities, no privilege escalation via
    # setuid binaries.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Must exceed SHUTDOWN_TIMEOUT (15s in .env.example), otherwise docker
    # sends SIGKILL while the app is still draining requests.
    stop_grace_period: 20s
    depends_on:
      # service_completed_successfully also implies postgres is healthy,
      # because migrate itself waits for that.
      migrate:
        condition: service_completed_successfully
      # Started first so the cache and limiter work from the first request.
      # The API does not require Redis to be healthy to serve (it degrades).
      redis:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Local data only needs to outlive a benchmark session; this caps disk.
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:?set PROMETHEUS_HOST_PORT in .env}:9090"

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Local convenience: dashboards are viewable without logging in, but
      # read-only. Only reachable from this machine (loopback port below).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/auction-engine.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:?set GRAFANA_HOST_PORT in .env}:3000"
    depends_on:
      - prometheus

  # Load generator, only started explicitly (make bench-smoke, scripts/bench.sh).
  # It runs inside the compose network on purpose: from the host, traffic
  # would cross colima's port forwarder, which could become the bottleneck
  # being measured (docs/decisions/015).
  loadgen:
    build: .
    profiles: [bench]
    # The fixed flags live in the entrypoint because `docker compose run
    # loadgen <args>` replaces `command` entirely; entrypoint args remain and
    # the run's own flags are appended.
    entrypoint:
      - /loadgen
      - --api-url=http://api:8080
      - --metrics-url=http://api:9091/metrics
      - --database-url=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  promdata:
  grafanadata:
