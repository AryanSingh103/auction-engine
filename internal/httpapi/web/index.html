<!doctype html>
<!-- Deliberately plain (docs/PROJECT_BRIEF.md): one file, vanilla JS. It
     demonstrates the live-update client contract of docs/decisions/020. -->
<html>
<head><meta charset="utf-8"><title>auction-engine</title></head>
<body>
<h1>auction-engine</h1>
<p>
  Auction id <input id="auction" size="4" value="1">
  <button onclick="connect()">watch</button>
  <span id="conn">not connected</span>
</p>
<p>Current price: <b id="price">-</b> cents, leader: <b id="leader">-</b>, minimum next bid: <b id="min">-</b></p>
<p>
  Bid as user id <input id="user" size="4" value="1">
  amount (cents) <input id="amount" size="8">
  <button onclick="bid()">bid</button>
  <span id="result"></span>
</p>
<pre id="log"></pre>
<script>
// Client contract (docs/decisions/020). Bid ids grow along the chain, so
// the local head only ever moves forward.
let ws = null, gen = 0, head = null, auction = null, retry = 0, resyncing = false;

function log(line) {
  const el = document.getElementById("log");
  el.textContent = new Date().toISOString().slice(11, 23) + " " + line + "\n" + el.textContent.slice(0, 5000);
}

// Accept a full state only for the auction being watched, and never one
// older than what we already show (a stale cached response or a delayed
// resync must not move the head backwards).
function show(a, myGen) {
  if (myGen !== gen) return;
  if (auction && a.id !== auction.id) return;
  if (head !== null && (a.current_bid_id === null || a.current_bid_id < head)) return;
  auction = a;
  head = a.current_bid_id;
  document.getElementById("price").textContent = a.current_price ?? "none (starting " + a.starting_price + ")";
  document.getElementById("leader").textContent = a.current_leader_id ?? "-";
  document.getElementById("min").textContent = a.minimum_bid;
}

// Re-read the whole state after a missed message. One at a time, and the
// answer is dropped if the user switched auctions meanwhile.
async function resync(reason) {
  if (resyncing) return;
  resyncing = true;
  const myGen = gen, id = auction.id;
  log("resync: " + reason);
  try {
    const r = await fetch("/auctions/" + id);
    if (r.ok) show(await r.json(), myGen);
  } finally {
    resyncing = false;
  }
}

function connect() {
  if (ws) { ws.onclose = null; ws.close(); }
  const id = Number(document.getElementById("auction").value);
  const myGen = ++gen;
  if (!auction || auction.id !== id) { auction = null; head = null; }
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/auctions/" + id + "/live");
  ws.onopen = () => { retry = 0; document.getElementById("conn").textContent = "connected"; };
  ws.onmessage = (e) => {
    if (myGen !== gen) return;
    const m = JSON.parse(e.data);
    if (m.type === "snapshot") { show(m.auction, myGen); log("snapshot: head " + head); return; }
    if (m.type === "bid") {
      const b = m.bid;
      if (b.auction_id !== id) return;
      if (head !== null && b.id <= head) return;            // already have it
      if (b.prev_bid_id !== head) { resync("gap before bid " + b.id); return; }
      show({...auction, current_bid_id: b.id, current_price: b.amount, current_leader_id: b.user_id,
            minimum_bid: b.amount + auction.min_increment}, myGen);
      log("bid " + b.id + ": " + b.amount + " by user " + b.user_id);
      return;
    }
    // A sync older than our head just means the bid message overtook it.
    if (m.type === "sync" && m.auction_id === id && m.head_bid_id !== null && (head === null || m.head_bid_id > head))
      resync("sync says head " + m.head_bid_id);
  };
  ws.onclose = (e) => {
    if (myGen !== gen) return;
    document.getElementById("conn").textContent = "disconnected (" + e.code + ")";
    // 1013: dropped for being slow; 1001: server going away. Reconnect with
    // capped exponential backoff; the new snapshot resyncs everything.
    const delay = Math.min(10000, 250 * 2 ** retry++);
    setTimeout(() => { if (myGen === gen) connect(); }, delay);
  };
}

async function bid() {
  const r = await fetch("/auctions/" + document.getElementById("auction").value + "/bids", {
    method: "POST",
    headers: {"X-User-ID": document.getElementById("user").value, "Idempotency-Key": crypto.randomUUID()},
    body: JSON.stringify({amount: Number(document.getElementById("amount").value)}),
  });
  const body = await r.json();
  document.getElementById("result").textContent = r.status + " " + (body.error ? body.error.code : "accepted");
}
</script>
</body>
</html>
